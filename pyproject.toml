[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "hs-cablastp"
version = "0.1.0"
description = "Python wrappers for the CaBLASTP compressive protein-search pipeline"
requires-python = ">=3.8"

[project.scripts]
hs-cablastp-compress = "hs_cablastp.compress:main"
hs-cablastp-search   = "hs_cablastp.search:main"

[tool.setuptools]
packages = ["hs_cablastp"]
